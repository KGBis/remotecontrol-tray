name: Build Installers

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # Job 1: Gather pom.xml version and create single Release
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.artifact.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Get project version
        id: version
        run: |
          echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Get project artifactId
        id: artifact
        run: |
          echo "artifact=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RemoteControlTray v${{ steps.version.outputs.version }}
          body: "Release of RemoteControlTray version ${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Build installers for each OS
  build-installers:
    env:
      DIST_PATH: dist
      # DIST_APP_PATH: dist/app
      INSTALLERS_PATH: installers
      # INSTALLERS_APP_PATH: installers/app
      RELEASE_PATH: release
      PACKAGING_PATH: .packaging
      # ICONS_PATH: .packaging/icons
    needs: create-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            installer: msi
            artifact: windows

          - os: ubuntu-latest
            installer: linux
            artifact: linux

          - os: macos-latest
            installer: dmg
            artifact: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Define Derived Paths
        run: |
          echo "DIST_APP_PATH=$DIST_PATH/app" >> $GITHUB_ENV
          echo "INSTALLERS_APP_PATH=$INSTALLERS_PATH/app" >> $GITHUB_ENV
          echo "ICONS_PATH=$PACKAGING_PATH/icons" >> $GITHUB_ENV

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Distribution Folder
        shell: bash
        run: |
          rm -rf "$DIST_PATH"
          mkdir -p "$DIST_APP_PATH"
          cp target/${{ needs.create-release.outputs.artifact }}.jar "$DIST_APP_PATH"/

      - name: Compute Windows MSI version
        if: matrix.os == 'windows-latest'
        id: winver
        shell: bash
        run: |
          YEAR=$(date +%y)
          echo "msi_version=1.${YEAR}.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Generate installer with jpackage
        shell: bash
        run: |
          set -e
          
          # Artifact name
          ARTIFACT=${{ needs.create-release.outputs.artifact }}
          
          # jar name
          JAR_NAME="$ARTIFACT.jar"
          
          # default version (from pom.xml)
          APP_VERSION="${{ needs.create-release.outputs.version }}"

          # Windows MSI 'hacked' version as it does not like YYYY.MM.revision format 
          WIN_FLAGS=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            APP_VERSION="${{ steps.winver.outputs.msi_version }}"
            WIN_FLAGS="--win-menu --win-shortcut --win-per-user-install"
          fi
          
          # Common flags for jpackage
          MAIN_FLAGS=(
            --name $ARTIFACT
            --input $DIST_PATH
            --main-jar $JAR_NAME
            --dest $INSTALLERS_APP_PATH
            --app-version $APP_VERSION
            --copyright "Copyright © 2026 Enrique García (KGBis)"
            --vendor "KGBis"
          )
          
          # for Windows and macOS
          NON_LINUX_FLAGS=(
            --about-url "https://github.com/KGBis/remotecontrol-tray"
            --license-file LICENSE
          )
          
          # icons
          ICON_FLAG=""
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON_FLAG="--icon $ICONS_PATH/computer.ico"
          
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON_FLAG="--icon $ICONS_PATH/computer.icns"
          
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            ICON_FLAG="--icon $ICONS_PATH/computer.png"
          fi
          
          mkdir -p $INSTALLERS_PATH

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            jpackage --type msi "${MAIN_FLAGS[@]}" "${NON_LINUX_FLAGS[@]}" $ICON_FLAG $WIN_FLAGS

          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            jpackage --type dmg "${MAIN_FLAGS[@]}" "${NON_LINUX_FLAGS[@]}" $ICON_FLAG

          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            # install makeself
            sudo apt-get update
            sudo apt-get install -y makeself
          
            # execute jpackage
            jpackage --type app-image "${MAIN_FLAGS[@]}" $ICON_FLAG
          
            # copy install/uninstall scripts + .desktop
            cp -r "$PACKAGING_PATH/linux/app-image/"* "$INSTALLERS_PATH/"
          
            # create version file
            echo "$APP_VERSION" > "$INSTALLERS_PATH/VERSION"
          
            # create self installer
            makeself \
              --xz \
              --needroot \
              $INSTALLERS_PATH \
              "$ARTIFACT-linux.run" \
              "Remote Control Tray installer" \
              ./install.sh
          fi

      - name: Normalize Installer Name
        shell: bash
        run: |
          # Artifact name
          ARTIFACT=${{ needs.create-release.outputs.artifact }}
          
          # create release directory
          mkdir -p "$RELEASE_PATH"
          
          # move and rename installers to release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv "$INSTALLERS_APP_PATH/*.msi" "$RELEASE_PATH/$ARTIFACT-windows-x64.msi"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            mv "$INSTALLERS_APP_PATH/*.dmg" "$RELEASE_PATH/$ARTIFACT-macos.dmg"
          else 
            mv *.run "$RELEASE_PATH"/ || true # Linux 
          fi

      - name: Generate Checksums
        shell: bash
        run: |
          cd "$RELEASE_PATH"
          sha256sum * | grep -v checksums.sha256 >> checksums.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotecontrol-tray-${{ matrix.artifact }}
          path: ${{ env.RELEASE_PATH }}/*

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: ${{ env.RELEASE_PATH }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}