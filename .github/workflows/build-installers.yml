name: Build installers

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # Job 1: Gather pom.xml version and create single Release
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get project version
        id: version
        run: |
          echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RemoteControlTray v${{ steps.version.outputs.version }}
          body: "Release of RemoteControlTray version ${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Build installers for each OS
  build-installers:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            installer: msi
            artifact: windows
          - os: ubuntu-latest
            installer: linux
            artifact: linux
          - os: macos-latest
            installer: dmg
            artifact: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Compute Windows MSI version
        if: matrix.os == 'windows-latest'
        id: winver
        shell: bash
        run: |
          YEAR=$(date +%y)
          echo "msi_version=1.${YEAR}.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Generate installer with jpackage
        shell: bash
        run: |
          mkdir -p build/installer

          # default version (pom.xml)
          APP_VERSION="${{ needs.create-release.outputs.version }}"
          WIN_FLAGS=""

          # MSI version 
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            APP_VERSION="${{ steps.winver.outputs.msi_version }}"
            WIN_FLAGS="--win-menu --win-shortcut --win-per-user-install"
          fi
          
          # icon
          ICON_FLAG=""
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON_FLAG="--icon .packaging/icons/computer.ico"
          
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON_FLAG="--icon .packaging/icons/computer.icns"
          
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            ICON_FLAG="--icon .packaging/icons/computer.png"
          fi

          MAIN_FLAGS=(
            --name RemoteControlTray
            --input target
            --main-jar RemoteControlTray.jar
            --dest build/installer
            --app-version "$APP_VERSION"
            --copyright "Copyright © 2026 Enrique García (KGBis)"
            --license-file LICENSE
            )

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            jpackage --type msi "${MAIN_FLAGS[@]}" $WIN_FLAGS $ICON_FLAG

          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            jpackage --type dmg "${MAIN_FLAGS[@]}" $ICON_FLAG

          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            jpackage --type deb "${MAIN_FLAGS[@]}" $ICON_FLAG
            jpackage --type rpm "${MAIN_FLAGS[@]}" $ICON_FLAG
          fi

      - name: Normalize installer name
        shell: bash
        run: |
          cd build/installer

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv *.msi RemoteControlTray-Windows-x64.msi
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            mv *.dmg RemoteControlTray-macOS.dmg
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            mv *.deb RemoteControlTray-Linux-amd64.deb
            mv *.rpm RemoteControlTray-Linux-x86_64.rpm
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd build/installer
          sha256sum * > checksums.sha256

      - name: Upload artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControlTray-${{ matrix.artifact }}
          path: build/installer/*

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: build/installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}