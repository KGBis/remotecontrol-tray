name: Windows installer

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Distribution Folder
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/app
          cp target/RemoteControlTray.jar dist/app/

      - name: Compute MSI version
        id: winver
        shell: bash
        run: |
          YEAR=$(date +%y)
          echo "msi_version=1.${YEAR}.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Generate installer
        shell: bash
        run: |
          mkdir -p build/installer

          jpackage --type msi \
            --name RemoteControlTray \
            --input dist/app \
            --main-jar RemoteControlTray.jar \
            --dest build/installer \
            --app-version "${{ steps.winver.outputs.msi_version }}" \
            --win-menu \
            --win-shortcut \
            --win-per-user-install \
            --icon .packaging/icons/computer.ico \
            --about-url "https://github.com/KGBis/remotecontrol-tray" \
            --vendor "KGBis" \
            --license-file LICENSE \
            --verbose

      - name: Normalize name
        shell: bash
        run: |
          cd build/installer
          mv *.msi RemoteControlTray-Windows-x64.msi
          sha256sum * > checksums-windows.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControlTray-windows
          path: build/installer/*

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: build/installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}