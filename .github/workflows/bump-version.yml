name: Bump Version by Label

on:
  pull_request:
    types: [ labeled ]
    branches: [ develop ]

jobs:
  bump-version:
    # Solo se ejecuta si la etiqueta es una de las de versión
    if: contains(fromJSON('["major", "minor", "patch"]'), github.event.label.name)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Calcular e incrementar versión
        id: bump
        run: |
          LABEL="${{ github.event.label.name }}"
          
          # 1. Usar Maven para calcular el siguiente incremento
          mvn build-helper:parse-version versions:set \
            -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} \
            -D${LABEL}Version \
            versions:commit
          
          # 2. Obtener la nueva versión generada
          NEW_VER=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$NEW_VER" >> $GITHUB_OUTPUT

          # 3. Actualizar tu archivo de runtime (ejemplo: version.properties)
          sed -i "s/^version=.*/version=$NEW_VER/" src/main/resources/version.txt

      - name: Commit y Push de los cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.bump.outputs.VERSION }} [skip ci]"
          file_pattern: 'pom.xml src/main/resources/version.txt'
