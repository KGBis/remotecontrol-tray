name: macOS installer

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: mvn -B clean package

      - run: |
          rm -rf dist
          mkdir -p dist/app
          cp target/RemoteControlTray.jar dist/app/

      - run: |
          mkdir -p dist/app build/installer
          
          jpackage --type dmg \
            --name RemoteControlTray \
            --input dist/app \
            --main-jar RemoteControlTray.jar \
            --dest build/installer \
            --app-version "${{ inputs.version }}" \
            --icon .packaging/icons/computer.icns \
            --verbose

      - run: |
          cd build/installer
          
          mv *.dmg RemoteControlTray-macOS.dmg
          sha256sum * > checksums-macOS.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControlTray-macOS
          path: build/installer/*

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: build/installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}